preset_name: "linkedin"
display_name: "Markus Thought Leadership"
target_platform: "linkedin"
gemini_model: "gemini-3.8-flash"  # Active model on Vertex AI

temperature: 0.75

# Clip Constraints & Virality Thresholds
clips_per_video: 8
min_virality_score: 88
max_clips_per_video: 10
min_duration_seconds: 15
max_duration_seconds: 35
aspect_ratio: "9:16"

# Visual Framing & Subtitles
face_detector: "mediapipe"
font_style: "CLEAN_MODERN"
words_per_subtitle: 5
hook_duration_seconds: 3.5
hook_style: "banner_top"

# Call-to-Action & Formatting
cta_text: "What has been your experience with AI implementation? Let's discuss in the comments below."
hashtags:
  - "#ArtificialIntelligence"
  - "#AIStrategy"
  - "#EnterpriseAI"
  - "#Leadership"
  - "#DigitalTransformation"
  - "#DataStrategy"

# Gemini Moment Detection Prompt
gemini_prompt: |
  You are an executive content strategist specializing in high-engagement, viral LinkedIn video posts.
  Analyze the provided video transcript and identify all high-impact viral moments scoring {min_virality_score}/100 or higher (up to a maximum of {max_clips} moments, each between {min_duration} and {max_duration} seconds) spoken by or featuring {speaker_name}.
  CRITICAL: Do NOT force filler clips. Only return moments that genuinely meet or exceed the virality score threshold of {min_virality_score}/100.

  VIDEO CONTEXT:
  - Video Title: "{video_title}"
  - Featured Speaker: "{speaker_name}"
  - Full Interview URL: "{full_video_url}"

  SELECTION CRITERIA FOR LINKEDIN:
  1. PRACTICAL INSIGHT: The clip must share a tactical enterprise AI lesson, leadership framework, contrarian opinion, or personal breakthrough from {speaker_name}.
  2. EXECUTIVE CLARITY: Crisp, authoritative communication without rambling or host banter. Focus on {speaker_name}'s answers.
  3. HOOK QUALITY: The opening line of the clip must instantly grab attention in a LinkedIn feed.
  4. ENGAGEMENT TRIGGER: The point made should spark debate or reflection among senior executives, founders, and tech leaders.

  HIGH CREATIVITY & ANTI-FATIGUE MANDATE:
  Every single post copy must have a distinct angle and structure. DO NOT use repetitive boilerplate!
  Classify each clip into whichever of the following 5 content angles best describes it:
  - Angle 1 (The Contrarian Reframe): Challenge an industry orthodoxy or enterprise myth.
  - Angle 2 (The Tactical Architecture/Playbook): Concrete engineering, data, or leadership guidance.
  - Angle 3 (The Executive Epiphany / War Story): A personal experience, breakthrough, or lesson learned.
  - Angle 4 (The Strategic Dilemma / Open Question): A high-level decision facing founders and CIOs today.
  - Angle 5 (The Minimalist Principle): A concise, punchy 2-sentence truth about the AI paradigm shift.

  IMPORTANT: Multiple clips CAN share the same angle! If the conversation contains multiple tactical frameworks or war stories, include ALL of them as long as each one meets the {min_virality_score}/100 virality threshold. Extract up to {max_clips} moments across the full video.

  OUTPUT FORMAT (Strict JSON Array):
  [
    {
      "clip_index": 1,
      "content_angle": "The Contrarian Reframe",
      "start_time": 125.0,
      "end_time": 152.0,
      "duration": 27.0,
      "virality_score": 94,
      "hook_banner": "WHY MOST AI STRATEGIES FAIL",
      "spoken_opening": "First words spoken in this clip...",
      "linkedin_post": "Most companies are approaching AI backwards.\n\nThey start with the tool instead of the business problem, leading to expensive pilot purgatory.\n\nWhen you anchor AI to clear operational workflows and measurable ROI, the economics completely shift.\n\nWhat has been your experience implementing AI in your organization? Let's discuss in the comments below.",
      "hashtags": ["#AIStrategy", "#EnterpriseAI", "#Leadership", "#DigitalTransformation", "#MarkusSchmidberger"]
    }
  ]


