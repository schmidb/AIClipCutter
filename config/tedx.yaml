preset_name: "tedx"
display_name: "TEDx Glenbeigh 2027"
target_platform: "instagram_reels"
gemini_model: "gemini-3.8-flash"  # Active model for viral moment detection

temperature: 0.75

# Clip Constraints & Virality Thresholds
clips_per_video: 8
min_virality_score: 88
max_clips_per_video: 10
min_duration_seconds: 10
max_duration_seconds: 20
aspect_ratio: "9:16"

# Visual Framing & Subtitles
face_detector: "mediapipe"
font_style: "HORMOZI"
words_per_subtitle: 4
hook_duration_seconds: 3.0
hook_style: "banner_top"

# Event Copy & Call-to-Action
event_name: "TEDx Glenbeigh 2027"
cta_text: "🎟️ TEDx Glenbeigh returns in 2027. Don't miss the talks that will shape the future. Tap the link in bio to join the priority ticket waitlist!"
hashtags:
  - "#TEDx"
  - "#TEDxGlenbeigh"
  - "#IdeasWorthSpreading"
  - "#Glenbeigh2027"
  - "#Inspiration"
  - "#TalksThatMatter"
  - "#PersonalGrowth"
  - "#LifeLessons"
  - "#TEDTalks"
  - "#MindsetShift"

# Gemini Moment Detection Prompt
gemini_prompt: |
  You are an expert viral short-form video editor specializing in TEDx talks and Instagram Reels.
  Analyze the provided video transcript and identify all high-impact viral moments scoring {min_virality_score}/100 or higher (up to a maximum of {max_clips} moments, each strictly between {min_duration} and {max_duration} seconds).
  CRITICAL: Do NOT force low-quality moments or filler clips just to reach a count. Only return moments that genuinely meet or exceed the virality score threshold of {min_virality_score}/100. If only 4 moments qualify, return 4. If 8 or 9 qualify, return 8 or 9.

  VIDEO CONTEXT:
  - Speaker: {speaker_name}
  - Talk Title: {video_title}
  - Full Talk YouTube URL: {full_video_url}
  - Event: TEDx Glenbeigh (Glenbeigh, Co. Kerry, Ireland)
  - Instagram Handle: @TEDxGlenbeigh

  SELECTION CRITERIA FOR VIRAL CLIPS:
  1. IMMEDIATE SPOKEN HOOK: The first sentence must instantly grab attention (e.g., a provocative question, counter-intuitive statement, or bold truth). There must be ZERO filler, greeting, or stage intro.
  2. COMPLETE PUNCHLINE: The clip must deliver a complete, satisfying epiphany or insight by the end. The viewer should feel inspired or shocked.
  3. LOOPING POTENTIAL: The ending must cleanly transition back or leave the viewer wanting to re-watch.
  4. STRICT DURATION: Each clip MUST be between {min_duration} and {max_duration} seconds (ideal: 12-16 seconds).

  HIGH CREATIVITY & ANTI-FATIGUE MANDATE:
  Every single post caption must have a distinct angle and structure. DO NOT use repetitive boilerplate!
  Classify each clip into whichever of the following 5 content angles best describes its narrative hook:
  - Angle 1 (The Contrarian Take): Challenge a widespread belief or conventional wisdom.
  - Angle 2 (The Tactical Framework): A clear, actionable shift or lesson the viewer can apply today.
  - Angle 3 (The Personal Epiphany): An emotional, relatable moment of vulnerability or breakthrough.
  - Angle 4 (The Debate / Thought Provoker): A profound question urging viewers to reflect and comment.
  - Angle 5 (The Minimalist Soundbite): Laser-focused, poetic 2-line quote that leaves a lasting impression.

  IMPORTANT: Multiple clips CAN share the same angle! For example, if the talk contains two powerful "Contrarian Takes" or three actionable "Tactical Frameworks", include ALL of them as long as each one meets the {min_virality_score}/100 virality threshold. Extract up to {max_clips} moments across the entire talk.

  OUTPUT FORMAT (Strict JSON Array):
  [
    {
      "clip_index": 1,
      "content_angle": "The Contrarian Take",
      "start_time": 124.5,
      "end_time": 139.2,
      "duration": 14.7,
      "virality_score": 95,
      "hook_banner": "THE LIE ABOUT SUCCESS NO ONE ADMITS",
      "spoken_opening": "First words spoken in this clip...",
      "instagram_caption": "What if everything you were told about burnout was backwards? In this provocative moment from TEDx Glenbeigh, speaker {speaker_name} breaks down why rest isn't a reward—it's preventative maintenance.\n\nSave this for your next frantic work day.",
      "hashtags": ["#TEDxGlenbeigh", "#TEDx", "#MindsetShift", "#PersonalGrowth", "#IdeasWorthSpreading"]
    }
  ]

